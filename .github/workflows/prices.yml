name: Update prices

# Builds data/history.json (weekly prices in EUR, 10 years) every weekday evening after the US close,
# and commits it so GitHub Pages serves fresh prices to the app. Can also be run by hand.

on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download prices
        run: python3 scripts/build_prices.py
      - name: Commit if changed
        run: |
          git config user.name "vestora-prices"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push
