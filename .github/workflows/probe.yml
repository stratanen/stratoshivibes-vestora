name: Probe API

# Diagnostic: fetches one or more URLs (space-separated) the way the app would, with the site's Origin header,
# and prints status, CORS header and the start of each body.

on:
  workflow_dispatch:
    inputs:
      url:
        description: URLs to fetch, separated by spaces
        required: true
      jq:
        description: optional jq filter applied to each body instead of printing it
        required: false
        default: ""
      data:
        description: optional JSON body; if set, each URL is called with POST
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.url }}
          JQ: ${{ inputs.jq }}
          DATA: ${{ inputs.data }}
        run: |
          for URL in $URLS; do
            echo "=== $URL"
            if [ -n "$DATA" ]; then curl -sS -D h.txt -o b.txt -H "Origin: https://vestora.stratoshivibes.com" -H "Content-Type: application/json" -X POST --data "$DATA" "$URL" || true; else curl -sS -D h.txt -o b.txt -H "Origin: https://vestora.stratoshivibes.com" "$URL" || true; fi
            grep -i "^HTTP\|^access-control-allow-origin" h.txt || true
            echo "--- body ($(wc -c < b.txt) bytes)"; if [ -n "$JQ" ]; then jq -c "$JQ" b.txt | head -c 8000; else head -c 6000 b.txt; fi; echo
          done
